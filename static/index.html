<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyFlow — мой прогресс</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#080d19;color:#e9f0ff}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}input,select{background:#101b31;color:#eef4ff;border:1px solid #293a57;border-radius:11px;padding:12px;min-width:0}input:focus,select:focus{outline:1px solid #528aff}button{border:0;border-radius:11px;padding:11px 16px;background:#3579f6;color:white;font-weight:650}button:hover{filter:brightness(1.14)}button.ghost{background:#18263f;color:#b8ccf0}button.danger{background:#4a2331;color:#ffb4c4}.app{display:flex;min-height:100vh}.side{width:245px;flex-shrink:0;background:#0b1425;border-right:1px solid #1e2d47;padding:30px 16px}.brand{font-size:23px;font-weight:800;letter-spacing:-.7px;padding:0 13px 28px}.brand b{color:#5b9cff}.nav{display:grid;gap:7px}.nav button{background:transparent;color:#94a9c9;text-align:left;padding:13px 15px}.nav button.active,.nav button:hover{background:#172a4a;color:#fff}.main{width:100%;max-width:1300px;margin:auto;padding:36px 44px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}h1{margin:0;font-size:29px;letter-spacing:-.8px}h2{margin:0 0 18px;font-size:19px}p,.muted{color:#93a6c5}.muted{font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:#101b2e;border:1px solid #223451;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 8px 30px #0001}.metric{font-size:32px;font-weight:800;margin-top:8px}.blue{color:#70a6ff}.flex{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.item{display:flex;justify-content:space-between;align-items:center;gap:15px;border-bottom:1px solid #22324b;padding:13px 0}.item:last-child{border-bottom:0}.item label{display:flex;align-items:center;gap:12px;cursor:pointer}.item input[type=checkbox]{width:19px;height:19px;accent-color:#397eff}.item small{display:block;color:#91a5c5;margin-top:4px}.form{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}.form input{flex:1;min-width:120px}.form button{white-space:nowrap}.hidden{display:none!important}.days{display:flex;gap:7px;flex-wrap:wrap}.day{padding:8px 11px;background:#192945;border-radius:9px;color:#aabbd4}.day.sel{background:#2c65c8;color:white}.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}.weekcol{background:#101b2e;border:1px solid #243653;border-radius:13px;padding:12px;min-height:130px}.lesson{background:#1a2b48;border-left:3px solid #4587ff;padding:9px;margin:8px 0;border-radius:7px;font-size:13px}.lesson small{color:#a8bbd7}.chart{width:100%;height:210px;display:block}.chart text{fill:#91a5c5;font-size:10px}.login{max-width:400px;margin:14vh auto;padding:30px}.login input,.login button{width:100%;margin-top:12px}.notice{background:#142c49;padding:12px;border-radius:10px;color:#c7e0ff;margin:12px 0}.empty{color:#8ba0c0;padding:16px 0}.tag{font-size:12px;padding:5px 9px;border-radius:8px;background:#20375b;color:#acd0ff}.scroll{overflow:auto}#toast{position:fixed;right:20px;bottom:20px;background:#284879;padding:13px 20px;border-radius:12px;display:none;z-index:3}@media(max-width:850px){.app{display:block}.side{width:100%;padding:12px;border-right:0;border-bottom:1px solid #263653}.brand{padding:4px 8px 12px}.nav{display:flex;overflow-x:auto}.nav button{white-space:nowrap}.main{padding:22px 15px}.grid{grid-template-columns:1fr}.week{grid-template-columns:repeat(2,minmax(0,1fr))}.top{align-items:start}h1{font-size:24px}}
</style></head><body><div id="login" class="card login hidden"><div class="brand">Study<b>Flow</b></div><h2>Вход в личный кабинет</h2><p>Введи пароль, указанный при запуске.</p><form id="loginform"><input id="password" type="password" placeholder="Пароль" required autocomplete="current-password"><button>Войти</button></form><p id="loginerr" style="color:#ff9eb1"></p></div><div id="app" class="app hidden"><aside class="side"><div class="brand">Study<b>Flow</b> ✦</div><nav class="nav" id="nav"><button data-page="dashboard" class="active">◈ Обзор</button><button data-page="habits">✓ Привычки</button><button data-page="homework">▤ Домашка</button><button data-page="schedule">▦ Расписание</button><button data-page="grades">★ Оценки</button><button data-page="telegram">➤ Telegram</button><button data-page="reminders">⏰ Напоминания</button></nav></aside><main class="main"><div class="top"><div><h1 id="title">Мой день</h1><div class="muted" id="today"></div></div><button class="ghost" id="logout">Выйти</button></div><div id="content"></div></main></div><div id="toast"></div><script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dayNames=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];const iso=d=>{const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)};const now=iso(new Date());let state={habits:[],tasks:[],lessons:[],grades:[],stats:{history:[],grades:[]}},page='dashboard',selectedDays=[0,1,2,3,4,5,6];
async function api(path,method='GET',data){let r=await fetch('/api/'+path,{method,credentials:'same-origin',headers:{'Content-Type':'application/json'},body:data===undefined?undefined:JSON.stringify(data)});if(r.status===401){showLogin();throw Error('Требуется вход')}let x=await r.json();if(!r.ok)throw Error(x.detail||x.error||'Ошибка запроса');return x}
function toast(s){let x=$('#toast');x.textContent=s;x.style.display='block';setTimeout(()=>x.style.display='none',3000)}function showLogin(){$('#app').classList.add('hidden');$('#login').classList.remove('hidden')}function showApp(){$('#login').classList.add('hidden');$('#app').classList.remove('hidden')}
async function load(){let [habits,tasks,lessons,grades,stats]=await Promise.all(['habits','tasks','lessons','grades','stats'].map(x=>api(x)));Object.assign(state,{habits,tasks,lessons,grades,stats});window.reminderConfig=await api('reminders');render()}
function weekday(date){return (new Date(date+'T12:00:00').getDay()+6)%7}function due(t){return t.due?esc(t.due):'Без срока'}function progress(){let hs=state.habits.filter(h=>h.days.includes(weekday(now)));let done=hs.filter(h=>h.checks.includes(now)).length;return {hs,done,pct:hs.length?Math.round(done/hs.length*100):0}}
function graph(history){let width=740,height=190,pad=25,coords=history.map((h,i)=>`${pad+i*(width-2*pad)/Math.max(1,history.length-1)},${height-pad-h.percent*(height-2*pad)/100}`).join(' ');return `<svg class="chart" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" role="img" aria-label="График выполнения привычек за 30 дней"><line x1="25" y1="165" x2="715" y2="165" stroke="#354662"/><line x1="25" y1="95" x2="715" y2="95" stroke="#253650" stroke-dasharray="4"/><line x1="25" y1="25" x2="715" y2="25" stroke="#253650" stroke-dasharray="4"/><text x="0" y="28">100%</text><text x="5" y="98">50%</text><text x="10" y="168">0%</text><polyline fill="none" stroke="#528fff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="${coords}"/><text x="25" y="185">${history[0]?.day||''}</text><text x="635" y="185">${history.at(-1)?.day||''}</text></svg>`}
function habitRows(date=now){let hs=state.habits.filter(h=>h.days.includes(weekday(date))&&h.created<=date);return hs.length?hs.map(h=>`<div class="item"><label><input type="checkbox" ${h.checks.includes(date)?'checked':''} onchange="toggleHabit(${h.id},'${date}',this.checked)"><span>${esc(h.name)}<small>${h.days.map(i=>dayNames[i]).join(' · ')}</small></span></label><button class="ghost" onclick="remove('habits',${h.id})">×</button></div>`).join(''):'<div class="empty">На этот день привычек нет. Добавь первую!</div>'}
function taskRows(limit=0){let arr=limit?state.tasks.filter(t=>!t.done).slice(0,limit):state.tasks;return arr.length?arr.map(t=>`<div class="item"><label><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask(${t.id},this.checked)"><span style="${t.done?'text-decoration:line-through;opacity:.6':''}">${esc(t.title)}<small>${esc(t.subject||'Личное')} · ${due(t)}</small></span></label><button class="ghost" onclick="remove('tasks',${t.id})">×</button></div>`).join(''):'<div class="empty">Пока нет заданий.</div>'}
function dashboard(){let p=progress(),open=state.tasks.filter(t=>!t.done),todayLessons=state.lessons.filter(l=>l.weekday===weekday(now));return `<div class="grid"><div class="card"><div class="muted">Привычки сегодня</div><div class="metric blue">${p.done}/${p.hs.length}</div></div><div class="card"><div class="muted">Выполнение</div><div class="metric">${p.pct}%</div></div><div class="card"><div class="muted">Осталось заданий</div><div class="metric">${open.length}</div></div></div><div class="card"><h2>📈 Продуктивность за 30 дней</h2>${graph(state.stats.history)}</div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><div class="card"><h2>✓ Привычки на сегодня</h2>${habitRows()}</div><div class="card"><h2>▤ Ближайшая домашка</h2>${taskRows(5)}</div><div class="card"><h2>▦ Уроки сегодня</h2>${todayLessons.length?todayLessons.map(l=>`<div class="item"><span>${l.period}. ${esc(l.subject)}<small>${esc(l.start)} ${esc(l.room)}</small></span></div>`).join(''):'<div class="empty">Уроков нет</div>'}</div></div>`}
function habits(){return `<div class="card"><h2>Новая привычка</h2><form class="form" onsubmit="addHabit(event)"><input id="habitname" placeholder="Например, читать 20 минут" maxlength="100" required><button>Добавить</button></form><div class="muted" style="margin-bottom:10px">В какие дни выполнять?</div><div class="days">${dayNames.map((d,i)=>`<button type="button" class="day ${selectedDays.includes(i)?'sel':''}" onclick="selectDay(${i})">${d}</button>`).join('')}</div></div><div class="card"><div class="flex between"><h2>Отметки за день</h2><input type="date" id="habitdate" value="${window.habitDate||now}" onchange="window.habitDate=this.value;render()"></div>${habitRows(window.habitDate||now)}</div><div class="card"><h2>Все привычки</h2>${state.habits.length?state.habits.map(h=>`<div class="item"><span>${esc(h.name)}<small>${h.days.map(i=>dayNames[i]).join(', ')}</small></span><button class="danger" onclick="remove('habits',${h.id})">Удалить</button></div>`).join(''):'<div class="empty">Список пуст.</div>'}</div>`}
function homework(){return `<div class="card"><h2>Добавить задание</h2><form class="form" onsubmit="addTask(event)"><input id="tasktitle" placeholder="Что нужно сделать?" required maxlength="200"><input id="tasksubject" placeholder="Предмет"><input id="taskdue" type="date"><button>Добавить</button></form></div><div class="card"><h2>Мои задания</h2>${taskRows()}</div>`}
function schedule(){return `<div class="card"><h2>Добавить урок</h2><form class="form" onsubmit="addLesson(event)"><select id="lessonweekday">${dayNames.map((d,i)=>`<option value="${i}">${d}</option>`).join('')}</select><input id="lessonperiod" type="number" min="1" max="20" value="1" title="Номер урока" required style="max-width:95px"><input id="lessonsubject" placeholder="Предмет" required><input id="lessonstart" type="time" title="Начало"><input id="lessonfinish" type="time" title="Конец"><input id="lessonroom" placeholder="Кабинет"><button>Добавить</button></form></div><div class="week">${dayNames.map((d,i)=>`<div class="weekcol"><strong>${d}</strong>${state.lessons.filter(l=>l.weekday===i).map(l=>`<div class="lesson"><div class="flex between"><b>${l.period}. ${esc(l.subject)}</b><button class="ghost" style="padding:3px 7px" onclick="remove('lessons',${l.id})">×</button></div><small>${esc(l.start)} ${l.finish?'– '+esc(l.finish):''} ${esc(l.room)}</small></div>`).join('')}</div>`).join('')}</div>`}
function grades(){let av=state.stats.grades;return `<div class="card"><h2>Добавить оценку</h2><form class="form" onsubmit="addGrade(event)"><input id="gradesubject" placeholder="Предмет" required><select id="gradevalue">${[5,4,3,2,1].map(n=>`<option value="${n}">${n}</option>`).join('')}</select><input id="gradeday" type="date" value="${now}" required><button>Добавить</button></form></div><div class="card"><h2>Средний балл</h2>${av.length?av.map(g=>`<div class="item"><b>${esc(g.subject)}</b><span class="tag">${g.average}</span></div>`).join(''):'<div class="empty">Оценок пока нет</div>'}</div><div class="card"><h2>История оценок</h2>${state.grades.map(g=>`<div class="item"><span>${esc(g.subject)}<small>${esc(g.day)}</small></span><div class="flex"><span class="tag">${g.grade}</span><button class="ghost" onclick="remove('grades',${g.id})">×</button></div></div>`).join('')||'<div class="empty">Пусто</div>'}</div>`}
function telegram(){return `<div class="card"><h2>➤ Привязка Telegram-бота</h2><p>Запусти бота с токеном BotFather (инструкция в README). Затем получи одноразовый код и отправь боту команду привязки.</p><button onclick="linkCode()">Получить код на 10 минут</button><div id="linkresult" class="notice hidden"></div><p>После привязки доступны команды <b>/today</b>, <b>/habits</b>, <b>/done ID</b>, <b>/undo ID</b>, <b>/homework</b>, <b>/task ID</b>, <b>/schedule</b>.</p><p class="muted">Сайт и бот должны использовать одну базу данных. Время уведомлений настраивается в разделе «Напоминания».</p></div>`}

function reminders(){let r=window.reminderConfig||{timezone:'Europe/Moscow',schedule_enabled:true,schedule_time:'20:00',homework_enabled:true,homework_time:'18:00'};return `<div class="card"><h2>⏰ Настройка уведомлений</h2><p>Бот отправляет сообщения в выбранное время. Для этого Telegram должен быть привязан, а сервер и бот должны работать.</p><form onsubmit="saveReminders(event)" style="display:grid;gap:18px;max-width:560px"><label>Часовой пояс (например Europe/Moscow, Europe/Stockholm)<input id="rtimezone" value="${esc(r.timezone)}" style="display:block;width:100%;margin-top:8px" required></label><div class="notice"><label class="flex"><input id="rscheduleenabled" type="checkbox" ${r.schedule_enabled?'checked':''}> Отправлять расписание на завтра</label><label style="display:block;margin-top:12px">Время отправки <input id="rscheduletime" type="time" value="${esc(r.schedule_time)}" required></label></div><div class="notice"><label class="flex"><input id="rhomeworkenabled" type="checkbox" ${r.homework_enabled?'checked':''}> Напоминать о невыполненном ДЗ каждый день</label><label style="display:block;margin-top:12px">Время отправки <input id="rhomeworktime" type="time" value="${esc(r.homework_time)}" required></label><small class="muted">Если все задания выполнены, сообщение не отправляется.</small></div><button type="submit">Сохранить настройки</button></form></div>`}
window.saveReminders=async e=>{e.preventDefault();let data={timezone:$('#rtimezone').value.trim(),schedule_enabled:$('#rscheduleenabled').checked,schedule_time:$('#rscheduletime').value,homework_enabled:$('#rhomeworkenabled').checked,homework_time:$('#rhomeworktime').value};try{window.reminderConfig=await api('reminders','PUT',data);toast('Настройки сохранены');render()}catch(err){toast(err.message)}};

const titles={dashboard:'Мой день',habits:'Трекер привычек',homework:'Домашние задания',schedule:'Школьное расписание',grades:'Мои оценки',telegram:'Telegram-бот',reminders:'Напоминания'};
function render(){$('#title').textContent=titles[page];$('#today').textContent=new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long',year:'numeric'});document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#content').innerHTML=({dashboard,habits,homework,schedule,grades,telegram,reminders})[page]()}
async function mutate(path,method,data){try{await api(path,method,data);await load()}catch(e){toast(e.message)}}
window.toggleHabit=(id,day,done)=>mutate(`habits/${id}/check`,'PUT',{day,done});window.toggleTask=(id,done)=>mutate(`tasks/${id}`,'PUT',{done});window.remove=async (type,id)=>{if(confirm('Удалить запись?'))await mutate(`${type}/${id}`,'DELETE')};window.selectDay=i=>{selectedDays=selectedDays.includes(i)?selectedDays.filter(x=>x!==i):[...selectedDays,i];render()};
window.addHabit=e=>{e.preventDefault();if(!selectedDays.length)return toast('Выбери хотя бы один день');mutate('habits','POST',{name:$('#habitname').value,days:selectedDays})};window.addTask=e=>{e.preventDefault();mutate('tasks','POST',{title:$('#tasktitle').value,subject:$('#tasksubject').value,due:$('#taskdue').value})};window.addLesson=e=>{e.preventDefault();mutate('lessons','POST',{weekday:+$('#lessonweekday').value,period:+$('#lessonperiod').value,subject:$('#lessonsubject').value,start:$('#lessonstart').value,finish:$('#lessonfinish').value,room:$('#lessonroom').value})};window.addGrade=e=>{e.preventDefault();mutate('grades','POST',{subject:$('#gradesubject').value,grade:+$('#gradevalue').value,day:$('#gradeday').value})};window.linkCode=async()=>{try{let x=await api('bot/link');let el=$('#linkresult');el.classList.remove('hidden');el.textContent='Отправь своему боту: /link '+x.code}catch(e){toast(e.message)}};
$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b){page=b.dataset.page;render()}});$('#loginform').addEventListener('submit',async e=>{e.preventDefault();try{await api('login','POST',{password:$('#password').value});$('#password').value='';showApp();await load()}catch(e){$('#loginerr').textContent=e.message}});$('#logout').addEventListener('click',async()=>{await api('logout','POST');showLogin()});api('me').then(()=>{showApp();load()}).catch(()=>showLogin());
</script></body></html>
