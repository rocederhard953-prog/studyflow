<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyFlow</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#020306;color:#f1f4ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 10%,#10182a 0,transparent 38%),radial-gradient(ellipse at 85% 75%,#111025 0,transparent 38%),#020306;overflow-x:hidden}body:before{content:"";position:fixed;inset:-20%;pointer-events:none;z-index:-1;background-image:radial-gradient(2px 2px at 20% 30%,#fff9 50%,transparent 100%),radial-gradient(1px 1px at 70% 20%,#9dbbff99 50%,transparent 100%),radial-gradient(2px 2px at 80% 75%,#fff8 50%,transparent 100%),radial-gradient(1px 1px at 35% 80%,#a8baffaa 50%,transparent 100%);background-size:310px 270px;filter:blur(1.5px);animation:stars 35s linear infinite}@keyframes stars{to{transform:translate3d(35px,-25px,0)}}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #34415d;background:linear-gradient(135deg,#253b65,#15213a);color:white;border-radius:12px;padding:11px 15px;transition:.22s}button:hover{transform:translateY(-2px);box-shadow:0 8px 28px #527dff35;border-color:#668bdb}input,select,textarea{background:#080d18;color:#f4f6ff;border:1px solid #26334b;border-radius:11px;padding:12px;min-width:0}input:focus,textarea:focus,select:focus{outline:1px solid #759aff}.hidden{display:none!important}.app{display:flex;min-height:100vh}.side{width:245px;flex-shrink:0;padding:27px 15px;background:#05070dcc;backdrop-filter:blur(20px);border-right:1px solid #ffffff12}.brand{font-size:24px;font-weight:850;padding:0 12px 25px;letter-spacing:-1px}.brand b{color:#8daeff}.nav{display:grid;gap:6px}.nav button{background:transparent;border-color:transparent;color:#9daac5;text-align:left}.nav button.active,.nav button:hover{background:#a5baff16;color:white;border-color:#a5baff25}.main{width:100%;max-width:1380px;margin:auto;padding:35px 42px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px;gap:15px}h1{font-size:30px;margin:0;letter-spacing:-1px}h2{font-size:19px;margin:0 0 16px}.muted{color:#8d9ab3;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px}.card{background:linear-gradient(145deg,#111722d9,#090d16e8);border:1px solid #ffffff13;border-radius:19px;padding:21px;margin-bottom:17px;box-shadow:0 15px 45px #0007;backdrop-filter:blur(18px);animation:rise .45s ease both}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.metric{font-size:34px;font-weight:850;margin-top:8px}.blue{color:#9bb9ff}.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.form{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.form input{flex:1;min-width:125px}.item{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #ffffff10;padding:13px 0}.item:last-child{border:0}.item small{display:block;color:#8b9ab6;margin-top:4px}.item label{display:flex;align-items:center;gap:10px}.item input[type=checkbox]{width:18px;height:18px;accent-color:#8caeff}.days{display:flex;gap:6px;flex-wrap:wrap}.day{padding:8px 12px;background:#101a2d}.day.sel{background:#405f9b}.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.weekcol{background:#0b111d;border:1px solid #ffffff12;border-radius:13px;padding:10px;min-height:120px}.lesson{background:#15223a;border-left:3px solid #8aaaff;padding:9px;margin:8px 0;border-radius:7px;font-size:13px}.notice{background:#111d31;border:1px solid #344565;padding:13px;border-radius:12px;margin:12px 0}.tag{font-size:12px;background:#263958;padding:5px 9px;border-radius:8px}.empty{color:#8492ac;padding:14px 0}.chart{width:100%;height:210px}.chart text{fill:#8d9ab3;font-size:10px}.login{max-width:430px;margin:12vh auto;padding:30px}.login input,.login button{width:100%;margin-top:12px}.login h2{margin-top:10px}#toast{position:fixed;right:20px;bottom:20px;background:#253e6a;padding:13px 18px;border-radius:12px;display:none;z-index:8}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}.gallery img{width:100%;height:170px;object-fit:cover;border-radius:12px;border:1px solid #ffffff20}.gallery .card{margin:0}.danger{background:#48232e}.auth-tabs{display:flex;gap:8px;margin-bottom:12px}@media(max-width:850px){.app{display:block}.side{width:100%;padding:12px;border-right:0;border-bottom:1px solid #ffffff15}.brand{padding:4px 8px 12px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:10px}.main{padding:20px 13px}.week{grid-template-columns:repeat(2,minmax(0,1fr))}.top{align-items:flex-start}h1{font-size:24px}}
</style></head><body>
<div id="auth" class="card login"><div class="brand">Study<b>Flow</b> ✦</div><div class="auth-tabs"><button id="loginTab">Вход</button><button id="regTab">Регистрация</button></div><h2 id="authTitle">Войти в аккаунт</h2><form id="authForm"><input id="username" placeholder="Логин" minlength="3" maxlength="32" required autocomplete="username"><input id="password" type="password" placeholder="Пароль (минимум 8 символов)" minlength="8" required autocomplete="current-password"><button id="authSubmit">Войти</button></form><p id="authError" class="muted"></p><p class="muted">Твои привычки, дневник и заметки доступны только в твоём аккаунте.</p></div>
<div id="app" class="app hidden"><aside class="side"><div class="brand">Study<b>Flow</b> ✦</div><nav class="nav" id="nav"><button data-page="dashboard" class="active">◈ Обзор</button><button data-page="habits">✓ Привычки</button><button data-page="homework">▤ Домашка</button><button data-page="schedule">▦ Расписание</button><button data-page="grades">★ Оценки</button><button data-page="cheats">✧ Шпаргалки</button><button data-page="telegram">➤ Telegram</button><button data-page="reminders">◷ Напоминания</button></nav></aside><main class="main"><div class="top"><div><h1 id="title">Мой день</h1><div class="muted" id="today"></div></div><div class="flex"><span id="who" class="muted"></span><button id="logout">Выйти</button></div></div><div id="content"></div></main></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dn=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);const now=iso(new Date());let page='dashboard',reg=false,days=[0,1,2,3,4,5,6],s={habits:[],tasks:[],lessons:[],grades:[],stats:{history:[]},cheats:[]};
async function api(p,m='GET',d){let o={method:m,credentials:'same-origin'};if(d instanceof FormData)o.body=d;else if(d!==undefined){o.headers={'Content-Type':'application/json'};o.body=JSON.stringify(d)}let r=await fetch('/api/'+p,o);let x;try{x=await r.json()}catch{x={}}if(!r.ok)throw Error(x.detail||x.error||'Ошибка');return x}function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2800)}function authMode(v){reg=v;$('#authTitle').textContent=v?'Создать аккаунт':'Войти в аккаунт';$('#authSubmit').textContent=v?'Зарегистрироваться':'Войти';$('#password').autocomplete=v?'new-password':'current-password';$('#authError').textContent=''}$('#loginTab').onclick=()=>authMode(false);$('#regTab').onclick=()=>authMode(true);
$('#authForm').onsubmit=async e=>{e.preventDefault();try{await api(reg?'register':'login','POST',{username:$('#username').value,password:$('#password').value});$('#password').value='';await boot()}catch(x){$('#authError').textContent=x.message}};$('#logout').onclick=async()=>{await api('logout','POST');$('#app').classList.add('hidden');$('#auth').classList.remove('hidden')};
async function boot(){let me=await api('me');$('#who').textContent='@'+me.username;$('#auth').classList.add('hidden');$('#app').classList.remove('hidden');await load()}async function load(){let [habits,tasks,lessons,grades,stats,cheats,rem]=await Promise.all(['habits','tasks','lessons','grades','stats','cheatsheets','reminders'].map(x=>api(x)));Object.assign(s,{habits,tasks,lessons,grades,stats,cheats});window.rem=rem;render()}
function wd(d){return(new Date(d+'T12:00:00').getDay()+6)%7}function graph(a){let w=700,h=180,p=24,pts=a.map((x,i)=>`${p+i*(w-2*p)/Math.max(1,a.length-1)},${h-p-x.percent*(h-2*p)/100}`).join(' ');return `<svg class="chart" viewBox="0 0 ${w} ${h}"><line x1="24" y1="156" x2="676" y2="156" stroke="#35415a"/><polyline points="${pts}" fill="none" stroke="#91b1ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="24" y="176">${a[0]?.day||''}</text><text x="610" y="176">${a.at(-1)?.day||''}</text></svg>`}
function habitRows(d=now){let a=s.habits.filter(x=>x.days.includes(wd(d))&&x.created<=d);return a.length?a.map(x=>`<div class="item"><label><input type="checkbox" ${x.checks.includes(d)?'checked':''} onchange="habitCheck(${x.id},'${d}',this.checked)">${esc(x.name)}</label><button class="danger" onclick="del('habits',${x.id})">×</button></div>`).join(''):'<div class="empty">На этот день привычек нет.</div>'}
function taskRows(){return s.tasks.length?s.tasks.map(x=>`<div class="item"><div><label><input type="checkbox" ${x.done?'checked':''} onchange="taskDone(${x.id},this.checked)"><span>${esc(x.title)}<small>${esc(x.subject||'Без предмета')} · ${esc(x.due||'Без срока')}</small></span></label>${(x.images||[]).map(im=>`<a href="/api/images/${im.id}" target="_blank">📷 ${esc(im.original_name)}</a>`).join(' ')}</div><button class="danger" onclick="del('tasks',${x.id})">×</button></div>`).join(''):'<div class="empty">Заданий пока нет.</div>'}
function dashboard(){let a=s.habits.filter(x=>x.days.includes(wd(now))),n=a.filter(x=>x.checks.includes(now)).length;return `<div class="grid"><div class="card"><div class="muted">Привычки сегодня</div><div class="metric blue">${n}/${a.length}</div></div><div class="card"><div class="muted">Выполнение</div><div class="metric">${a.length?Math.round(n/a.length*100):0}%</div></div><div class="card"><div class="muted">Осталось ДЗ</div><div class="metric">${s.tasks.filter(x=>!x.done).length}</div></div></div><div class="card"><h2>✦ Продуктивность за 30 дней</h2>${graph(s.stats.history)}</div><div class="grid"><div class="card"><h2>Привычки сегодня</h2>${habitRows()}</div><div class="card"><h2>Ближайшая домашка</h2>${taskRows().slice(0,1200)}</div></div>`}
function habits(){return `<div class="card"><h2>Новая привычка</h2><form class="form" onsubmit="addHabit(event)"><input id="hn" placeholder="Например, читать 20 минут" required><button>Добавить</button></form><div class="days">${dn.map((x,i)=>`<button type="button" class="day ${days.includes(i)?'sel':''}" onclick="daySel(${i})">${x}</button>`).join('')}</div></div><div class="card"><h2>Отметки</h2><input type="date" id="hd" value="${window.hd||now}" onchange="window.hd=this.value;render()">${habitRows(window.hd||now)}</div><div class="card"><h2>Все привычки</h2>${s.habits.map(x=>`<div class="item">${esc(x.name)}<button class="danger" onclick="del('habits',${x.id})">Удалить</button></div>`).join('')}</div>`}
function homework(){return `<div class="card"><h2>Новое домашнее задание</h2><form class="form" onsubmit="addTask(event)"><input id="tt" placeholder="Что нужно сделать?" required><input id="ts" placeholder="Предмет"><input id="td" type="date"><input id="tf" type="file" accept="image/jpeg,image/png,image/webp" multiple><button>Добавить</button></form><p class="muted">Можно прикрепить несколько изображений JPG, PNG или WEBP (до 8 МБ каждое).</p></div><div class="card"><h2>Мои задания</h2>${taskRows()}</div>`}
function schedule(){return `<div class="card"><h2>Добавить урок</h2><form class="form" onsubmit="addLesson(event)"><select id="lw">${dn.map((x,i)=>`<option value="${i}">${x}</option>`).join('')}</select><input id="lp" type="number" min="1" max="20" value="1" style="max-width:80px"><input id="ls" placeholder="Предмет" required><input id="la" type="time"><input id="lf" type="time"><input id="lr" placeholder="Кабинет"><button>Добавить</button></form></div><div class="week">${dn.map((x,i)=>`<div class="weekcol"><b>${x}</b>${s.lessons.filter(l=>l.weekday===i).map(l=>`<div class="lesson"><b>${l.period}. ${esc(l.subject)}</b><small>${esc(l.start)} ${esc(l.finish)} ${esc(l.room)}</small><button class="danger" onclick="del('lessons',${l.id})">×</button></div>`).join('')}</div>`).join('')}</div>`}
function grades(){return `<div class="card"><h2>Добавить оценку</h2><form class="form" onsubmit="addGrade(event)"><input id="gs" placeholder="Предмет" required><select id="gv">${[5,4,3,2,1].map(x=>`<option>${x}</option>`)}</select><input id="gd" type="date" value="${now}"><button>Добавить</button></form></div><div class="card"><h2>Средний балл</h2>${s.stats.grades.map(x=>`<div class="item">${esc(x.subject)} <b>${x.average}</b></div>`).join('')}</div><div class="card"><h2>История</h2>${s.grades.map(x=>`<div class="item">${esc(x.subject)} · ${x.day}<b>${x.grade}</b><button class="danger" onclick="del('grades',${x.id})">×</button></div>`).join('')}</div>`}
function cheats(){return `<div class="card"><h2>Добавить шпаргалку</h2><form class="form" onsubmit="addCheat(event)"><input id="ct" placeholder="Название, например Формулы площади" required><input id="cs" placeholder="Предмет"><input id="cd" placeholder="Описание"><input id="cf" type="file" accept="image/jpeg,image/png,image/webp" required><button>Загрузить</button></form></div><div class="gallery">${s.cheats.map(x=>`<div class="card"><a href="/api/cheatsheets/${x.id}/image" target="_blank"><img src="/api/cheatsheets/${x.id}/image" loading="lazy"></a><b>${esc(x.title)}</b><div class="muted">${esc(x.subject)} · ${esc(x.description)}</div><button class="danger" onclick="del('cheatsheets',${x.id})">Удалить</button></div>`).join('')||'<div class="empty">Пока нет шпаргалок.</div>'}</div>`}
function telegram(){return `<div class="card"><h2>Telegram</h2><p>Создай код и отправь боту команду /link КОД.</p><button onclick="link()">Получить код привязки</button><div id="lc" class="notice hidden"></div><p class="muted">Команды: /today, /habits, /done ID, /undo ID, /homework, /task ID, /schedule, /tomorrow.</p></div>`}
function reminders(){let r=window.rem;const opts=[[60,'Каждый час'],[120,'Каждые 2 часа'],[180,'Каждые 3 часа'],[240,'Каждые 4 часа'],[360,'Каждые 6 часов'],[480,'Каждые 8 часов'],[720,'Каждые 12 часов'],[1440,'Раз в день']];let select=(id,v)=>`<select id="${id}">${opts.map(([n,t])=>`<option value="${n}" ${v===n?'selected':''}>${t}</option>`).join('')}</select>`;return `<div class="card"><h2>Настройки уведомлений</h2><form onsubmit="saveRem(event)" style="display:grid;gap:14px;max-width:600px"><label>Часовой пояс<input id="tz" value="${esc(r.timezone)}" required style="display:block;width:100%"></label><div class="notice"><label><input id="se" type="checkbox" ${r.schedule_enabled?'checked':''}> Расписание на завтра</label><div class="flex"><label>Первое время <input id="st" type="time" value="${r.schedule_time}"></label>${select('si',r.schedule_interval)}</div></div><div class="notice"><label><input id="he" type="checkbox" ${r.homework_enabled?'checked':''}> Невыполненное ДЗ</label><div class="flex"><label>Первое время <input id="ht" type="time" value="${r.homework_time}"></label>${select('hi',r.homework_interval)}</div><p class="muted">Повторять с выбранного времени через заданный интервал. Если ДЗ выполнено полностью, уведомление не придёт.</p></div><button>Сохранить настройки</button></form></div>`}
const titles={dashboard:'Мой день',habits:'Привычки',homework:'Домашние задания',schedule:'Расписание',grades:'Оценки',cheats:'Шпаргалки',telegram:'Telegram',reminders:'Напоминания'};function render(){$('#title').textContent=titles[page];$('#today').textContent=new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long',year:'numeric'});document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#content').innerHTML=({dashboard,habits,homework,schedule,grades,cheats,telegram,reminders})[page]()}
$('#nav').onclick=e=>{let b=e.target.closest('[data-page]');if(b){page=b.dataset.page;render()}};window.daySel=i=>{days=days.includes(i)?days.filter(x=>x!==i):[...days,i];render()};window.addHabit=async e=>{e.preventDefault();await api('habits','POST',{name:$('#hn').value,days});await load()};window.habitCheck=async(i,d,done)=>{await api(`habits/${i}/check`,'PUT',{day:d,done});await load()};window.taskDone=async(i,done)=>{await api(`tasks/${i}`,'PUT',{done});await load()};window.del=async(t,i)=>{if(confirm('Удалить запись?')){await api(`${t}/${i}`,'DELETE');await load()}};window.addTask=async e=>{e.preventDefault();let x=await api('tasks','POST',{title:$('#tt').value,subject:$('#ts').value,due:$('#td').value});for(let f of $('#tf').files){let d=new FormData();d.append('file',f);await api(`tasks/${x.id}/images`,'POST',d)}await load()};window.addLesson=async e=>{e.preventDefault();await api('lessons','POST',{weekday:+$('#lw').value,period:+$('#lp').value,subject:$('#ls').value,start:$('#la').value,finish:$('#lf').value,room:$('#lr').value});await load()};window.addGrade=async e=>{e.preventDefault();await api('grades','POST',{subject:$('#gs').value,grade:+$('#gv').value,day:$('#gd').value});await load()};window.addCheat=async e=>{e.preventDefault();let d=new FormData();d.append('title',$('#ct').value);d.append('subject',$('#cs').value);d.append('description',$('#cd').value);d.append('file',$('#cf').files[0]);await api('cheatsheets','POST',d);await load()};window.link=async()=>{let x=await api('bot/link');$('#lc').classList.remove('hidden');$('#lc').textContent='Отправь боту: /link '+x.code};window.saveRem=async e=>{e.preventDefault();let d={timezone:$('#tz').value,schedule_enabled:$('#se').checked,schedule_time:$('#st').value,schedule_interval:+$('#si').value,homework_enabled:$('#he').checked,homework_time:$('#ht').value,homework_interval:+$('#hi').value};window.rem=await api('reminders','PUT',d);toast('Настройки сохранены');render()};
api('me').then(boot).catch(()=>{});
</script></body></html>
