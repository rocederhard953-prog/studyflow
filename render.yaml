services:
  - type: web
    name: studyflow
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python start.py
    healthCheckPath: /api/health
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: COOKIE_SECURE
        value: '1'
      - key: DATABASE_PATH
        value: /var/data/studyflow.db
    disk:
      name: studyflow-data
      mountPath: /var/data
      sizeGB: 1
